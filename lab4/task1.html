<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 — Стили текста</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #14243a;
            font-family: Arial, sans-serif;
        }

        .content {
            width: 700px;
            padding: 35px;
            background-color: #203653;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: white;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 3px 3px 6px black;
        }

        p {
            color: #c8cdd4;
            font-style: italic;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <main class="content">
        <h2>Мой путь в веб-разработке</h2>

        <p>
            Веб-разработка позволяет создавать современные сайты и приложения.
            Для этого необходимо изучить HTML, CSS и JavaScript. HTML отвечает
            за структуру страницы, CSS — за её оформление, а JavaScript добавляет
            интерактивность.
        </p>
    </main>
</body>
</html>

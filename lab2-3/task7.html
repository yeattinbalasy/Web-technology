  <style>
    body { margin: 24px; font-family: Arial, sans-serif; line-height: 1.5; }
    img { max-width: 100%; }
    .scene {
      position: relative;
      overflow: hidden;
      height: 390px;
      padding: 120px 15px 0;
      background: linear-gradient(#a4dcf6 0 47%, #2a97ab 48%, #146277);
    }
    .angel, .earth { position: absolute; width: 90px; height: 90px; }
    .angel { top: 12px; left: 0; animation: fly 6s linear infinite alternate; }
    .earth { left: 40px; top: 230px; animation: bob 3s ease-in-out infinite alternate; }
    @keyframes fly { to { left: calc(100% - 90px); } }
    @keyframes bob { to { top: 290px; } }
    @media (prefers-reduced-motion: reduce) {
      .angel, .earth { animation: none; }
    }
  </style>
